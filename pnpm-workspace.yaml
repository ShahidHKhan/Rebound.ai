packages:
  - "apps/*"
  - "packages/*"
overrides:
  # A stale nested expo-router@57.0.12 (buried inside @expo/cli's own
  # dependency chain, unrelated to apps/mobile's actual runtime
  # expo-router@57.0.14) pulled in react-native-gesture-handler@3.1.0
  # alongside the real 2.32.0 apps/mobile actually depends on — two
  # competing JS copies both trying to register the same native module
  # threw "RNGestureHandlerModule.install is not a function" on launch.
  # Forces every resolution to the one real version.
  react-native-gesture-handler: 2.32.0
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  sharp: false
  '@clerk/shared': true
  browser-tabs-lock: true
  bufferutil: false
  core-js: false
  utf-8-validate: false
  esbuild: true
  dtrace-provider: false
minimumReleaseAgeExclude:
  - expo-dev-client@57.0.12
  - expo-dev-launcher@57.0.12
  - expo-dev-menu@57.0.12
  - expo-constants@57.0.11
  - expo-notifications@57.0.11
